version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows current; the PR title names the new release.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  # Keeps the linters pinned in requirements-dev.txt current.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
